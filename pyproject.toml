[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "select-method-v3"
version = "3.2.0"
description = "Artifact-aware group-equal coverage subset selection with ExG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
features = ["Pillow>=9.0", "scipy>=1.9"]

[project.scripts]
select-method-v3 = "select_method_v3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
